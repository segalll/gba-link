[project]
name = "gba-link"
version = "0.1.0"
description = "Server-hosted GBA link multiplayer with a browser player"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.3", "aiortc==1.15.0", "av==17.1.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gba_link"]

[tool.setuptools.package-data]
gba_link = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.black]
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.bandit]
skips = ["B101"]
